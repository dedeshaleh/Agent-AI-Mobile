name: Android demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GODOT_VERSION: 4.5.1
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Godot and Android templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools build "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          curl --fail -L --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o .tools/godot.zip
          unzip -q .tools/godot.zip -d .tools
          chmod +x ".tools/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          ln -s "Godot_v${GODOT_VERSION}-stable_linux.x86_64" .tools/godot
          curl --fail -L --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o .tools/templates.zip
          unzip -j -q .tools/templates.zip 'templates/android_debug.apk' 'templates/android_release.apk' -d "$HOME/.local/share/godot/export_templates/4.5.1.stable"
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.1'
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.local/share/godot/keystores/debug.keystore
          key: agenthq-debug-key-${{ github.repository_id }}-v1
      - name: Import and test
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          .tools/godot --headless --path game --editor --import --quit
          .tools/godot --headless --path game --script ../tests/run_tests.gd
          .tools/godot --headless --path game --script ../tests/ui_smoke.gd
      - name: Export APK
        shell: bash
        run: |
          set -euo pipefail
          .tools/godot --headless --path game --export-debug Android ../build/AgentHQ-demo.apk
          test -s build/AgentHQ-demo.apk
          sha256sum build/AgentHQ-demo.apk > build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: AgentHQ-Android
          path: |
            build/AgentHQ-demo.apk
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Download instructions
        run: |
          echo '### Preview di HP' >> "$GITHUB_STEP_SUMMARY"
          echo 'Unduh artifact **AgentHQ-Android**, ekstrak ZIP, lalu instal **AgentHQ-demo.apk**. Demo tidak membutuhkan LLM. Pengujian di HP tetap diperlukan.' >> "$GITHUB_STEP_SUMMARY"
